<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compress Folder</title>
</head>
<body>
    <h1>Enter Folder Path to Compress</h1>
    <form action="/compress-folder/" method="post">
        {% csrf_token %}
        <label for="folder_path">Folder Path (on server):</label>
        <input type="text" id="folder_path" name="folder_path" required>
        <button type="submit">Compress</button>
    </form>
</body>
</html>
